# /etc/nginx/conf.d/campusdya-limits.conf  (contexto http — se carga solo)
server_tokens off;                                   # no revelar versión de Nginx
limit_req_zone $binary_remote_addr zone=cdya_api:10m  rate=20r/s;   # tráfico general por IP
limit_req_zone $binary_remote_addr zone=cdya_auth:10m rate=30r/m;   # login / recuperar contraseña
limit_conn_zone $binary_remote_addr zone=cdya_conn:10m;
