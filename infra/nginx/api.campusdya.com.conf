# /etc/nginx/sites-available/api.campusdya.com
# (certbot añadirá el bloque 443 + SSL automáticamente)
server {
    listen 80;
    server_name api.campusdya.com;
    client_max_body_size 35M;
    client_body_timeout 30s;
    client_header_timeout 15s;

    include /etc/nginx/snippets/campusdya-security.inc;   # blindaje (ver infra/SEGURIDAD.md)

    location / {
        limit_req zone=cdya_api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
