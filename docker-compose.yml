services:
  db:
    image: postgres:16-alpine
    container_name: academia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - academia_pgdata:/var/lib/postgresql/data
    # Sin puerto público: solo accesible dentro de la red del compose

  backend:
    build: ./backend
    container_name: academia_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "127.0.0.1:8010:8000"   # Nginx del droplet hará proxy a este puerto
    volumes:
      - academia_static:/app/static
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  academia_pgdata:
  academia_static:
